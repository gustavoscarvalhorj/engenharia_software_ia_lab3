name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'
  CI: true
  NG_CLI_ANALYTICS: 'false'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

defaults:
  run:
    working-directory: src/frontend

jobs:
  unit-tests:
    name: Testes unitários (Karma + Jasmine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: src/frontend/yarn.lock

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências
        run: corepack yarn install --frozen-lockfile

      - name: Executar testes unitários
        run: corepack yarn test --watch=false --no-progress --browsers=ChromeHeadless

  e2e-tests:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: src/frontend/yarn.lock

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências
        run: corepack yarn install --frozen-lockfile

      - name: Instalar navegador do Playwright (Chrome)
        run: corepack yarn playwright install --with-deps chrome

      - name: Executar testes E2E
        run: corepack yarn test:e2e

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
